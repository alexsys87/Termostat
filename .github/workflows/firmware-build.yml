name: Firmware build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc gcc-arm-none-eabi libnewlib-arm-none-eabi make
          arm-none-eabi-gcc --version

      - name: Unit tests
        run: make test

      - name: Build firmware
        run: make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: Termostat
          path: |
            build/Termostat.elf
            build/Termostat.hex
            build/Termostat.bin
            build/Termostat.map
          if-no-files-found: error

  renode:
    runs-on: ubuntu-latest
    env:
      RENODE_VERSION: 1.15.3

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi make

      - name: Install Renode
        run: |
          mkdir -p "$HOME/renode"
          curl -fsSL "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable-dotnet.tar.gz" \
            | tar -xz -C "$HOME/renode" --strip-components=1
          python3 -m pip install -r "$HOME/renode/tests/requirements.txt"
          echo "$HOME/renode" >> "$GITHUB_PATH"

      - name: Renode tests
        run: make -j"$(nproc)" renode-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renode-results
          path: build/renode
          if-no-files-found: ignore
